name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel superseded runs on the same ref — a PR that gets three pushes in a
# minute doesn't need three full builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: fails on a lockfile that has drifted from
      # package.json instead of quietly resolving new versions.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # The production build also runs the prebuild configuration gate. No
      # NEXT_PUBLIC_SITE_URL is set here, which is deliberate: CI exercises the
      # non-production path, where the gate reports problems as warnings.
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Separate job so a newly-published advisory surfaces as its own failure
      # rather than masking a genuine build or test regression.
      - run: npm audit --audit-level=high
